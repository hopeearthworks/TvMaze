[project]
name = "tvmaze-show-finder"
version = "1.0.0"
description = "Search the TVMaze API and keep the shows that meet a minimum rating (AI Assisted Scripting lab project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["tvmaze", "main"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]  # keep lab write-ups exactly as written
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["tvmaze", "main.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
